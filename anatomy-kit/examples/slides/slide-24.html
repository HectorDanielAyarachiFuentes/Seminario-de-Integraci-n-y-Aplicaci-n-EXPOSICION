.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

  out.push(k.lineSvg(k.knurl(31, 0, 8, PIVOT_Z - 3, PIVOT_Z + 3, 32, P), { tone: "lo" }));

  return out.join("");
}
function artSlide24(theta, flip, P, view, light) {

  out.push(`<path class="iso-line" data-tone="lit" style="stroke-width:2.2px" d="M${lamp[0]} ${lamp[1]} L${b1[0]} ${b1[1]}"/>`);

function artSlide25(theta, flip, P, view, light) {

  out.push(renderBox(-36, 36, -20, 20, 10.5, 26, P, view, light, { tone: "hi", customClass: "tfg-base-podium" }));

const SLIDE_ARTIFACTS = {
  1: artSlide1,
  2: artSlide2,
  3: artSlide3,
  4: artSlide4,
  5: artSlide5,
  6: artSlide6,
  7: artSlide7,
  8: artSlide8,
  9: artSlide9,
  10: artSlide10,
  11: artSlide11,
  12: artSlide12,
  13: artSlide13,
  14: artSlide14,
  15: artSlide15,
  16: artSlide16,
  17: artSlide17,
  18: artSlide18,
  19: artSlide19,
  20: artSlide20,
  21: artSlide21,
  22: artSlide22,
  23: artSlide23,
  24: artSlide24,
  25: artSlide25
};


let currentSlide = 24;
try {
  const urlParams = new URLSearchParams(window.location.search);
  const slideVal = urlParams.get("slide");
  if (slideVal !== null) {
    const param = parseInt(slideVal, 10);
    if (!isNaN(param) && param >= 1 && param <= 25) currentSlide = param;
  }
} catch (e) {}

const SLIDE_TITLES = {
  1: "Atril de Tesina · CURZAS UNCo",
  2: "Perfil del Autor · Héctor Ayarachi",
  3: "TP 2 · El Objeto Problema",
  4: "TP 3 · Marco Teórico y Antecedentes",
  5: "TP 4 · Metodología y Viabilidad",
  6: "Sede Viedma y los 10 Nodos",
  7: "Mediaciones Tecnológicas (Res. 196)",
  8: "Desnaturalización del Objeto",
  9: "Tensión: Permanencia vs Capacitación",
  10: "Pregunta y 5 Ejes de Factibilidad",
  11: "Matriz de Objetivos del TFG",
  12: "Modelo de Francisco Longo",
  13: "Subsistemas de Gestión de RRHH",
  14: "Dispositivo de Retroalimentación 360°",
  15: "Arquitectura Circular 360° CURZAS",
  16: "Poligobernanza y Poder Compartido",
  17: "Estado del Arte y Vacancia",
  18: "Estrategia Mixta (CUAL-cuan)",
  19: "Población y Muestreo Situado",
  20: "Matriz de Operacionalización",
  21: "Procedimiento y Cronograma 2027",
  22: "Viabilidad Integral y Avales",
  23: "Blindaje Ético y Confidencialidad",
  24: "Síntesis y Valor Público",
  25: "Agradecimientos y Cierre"
};

const figCorner = document.querySelector('[data-corner="fig"]');
const titleCorner = document.querySelector('[data-corner="title"]');

function updateSlideHeaders() {
  if (figCorner) figCorner.textContent = "Fig " + currentSlide;
  if (titleCorner && SLIDE_TITLES[currentSlide]) {
    titleCorner.textContent = SLIDE_TITLES[currentSlide];
  }
}
updateSlideHeaders();

const renderBase = ((P) => baseCircularPodio(P));
const renderSupport = ((P, tilt) => columnaElevacion(P, tilt));
const renderDesk = ((tilt, P, view, light) => atrilTablero(tilt, P, view, light));
const renderSubject = ((tilt, pageFlip, P, view, light) => SLIDE_ARTIFACTS[1](tilt, pageFlip, P, view, light));

// Dynamic 3D State
let currentAzimuth = 42;
let targetAzimuth = 42;
let azimuthVelocity = 0;

let currentTilt = NOMINAL_TILT;
let targetTilt = NOMINAL_TILT;
let tiltVelocity = 0;

let panX = 0;
let panY = 0;
let targetPanX = 0;
let targetPanY = 0;

let zoomScale = 1.0;
let targetZoomScale = 1.0;

let pageFlip = 0;
let targetPageFlip = 0;
let pageVelocity = 0;

let isDragging = false;
let dragMode = "orbit";
let startPointerX = 0;
let startPointerY = 0;
let startAzimuth = 42;
let startTilt = NOMINAL_TILT;
let startPanX = 0;
let startPanY = 0;

let isTurntableActive = false;
let touring = !still.matches;
let clock = 0;
let visible = true;
let idleTimer = 0;
let frame = 0;
let lastTime = 0;

function updateReadout() {
  const deg = (currentTilt * 180 / Math.PI).toFixed(1);
  const azNorm = Math.round((((currentAzimuth % 360) + 360) % 360));
  const zPct = Math.round(zoomScale * 100);
  const pNum = pageFlip > 0.4 ? "2 / 248" : "1 / 248";
  const state = isDragging ? (dragMode === "pan" ? "Moviendo" : "Rotando en 3D") : isTurntableActive ? "Auto-Giro 360°" : touring ? "Inspección académica" : "Defensa iniciada";
  const text = 'Giro: ' + azNorm + '° · Inclinación: ' + deg + '° · Zoom: ' + zPct + '% · Pág: ' + pNum + ' · ' + state;
  if (readout.textContent !== text) readout.textContent = text;
}

function renderFrame() {
  const radA = (currentAzimuth * Math.PI) / 180;
  const radE = (ELEVATION * Math.PI) / 180;
  view[0] = Math.cos(radA) * Math.cos(radE);
  view[1] = Math.sin(radA) * Math.cos(radE);
  view[2] = Math.sin(radE);

  const lNorm = Math.hypot(-Math.sin(radA), Math.cos(radA), 1.2);
  light[0] = -Math.sin(radA) / lNorm;
  light[1] = Math.cos(radA) / lNorm;
  light[2] = 1.2 / lNorm;

  P.azimuth = currentAzimuth;
  P.scale = baseScale * zoomScale;
  P.origin = [baseOrigin[0] + panX, baseOrigin[1] + panY];

  if (baseGroup) {
    baseGroup.innerHTML = renderBase(P);
  }
  if (pedestalGroup) {
    pedestalGroup.innerHTML = (currentSlide === 1 && typeof renderSupport === "function")
      ? renderSupport(P, currentTilt)
      : "";
  }
  if (deskGroup) {
    const deskHtml = (currentSlide === 1 && typeof renderDesk === "function")
      ? renderDesk(currentTilt, P, view, light)
      : "";
    const activeSubjectFn = (typeof SLIDE_ARTIFACTS !== "undefined" && SLIDE_ARTIFACTS[currentSlide])
      ? SLIDE_ARTIFACTS[currentSlide]
      : renderSubject;
    const subjectHtml = activeSubjectFn ? (activeSubjectFn(currentTilt, pageFlip, P, view, light) || "") : "";
    deskGroup.innerHTML = deskHtml + subjectHtml;
  }
  updateReadout();
}

function tick(now) {
  const dt = lastTime ? Math.min((now - lastTime) / 1000, 1 / 30) : 1 / 60;
  lastTime = now;

  if (isTurntableActive) {
    targetAzimuth -= dt * 28;
  } else if (touring && !still.matches) {
    clock += dt;
    targetTilt = NOMINAL_TILT + Math.sin(clock * 0.9) * 0.08;
    targetAzimuth = 42 + Math.sin(clock * 0.4) * 15;
    if (clock % 7 > 4.5 && clock % 7 < 6) {
      targetPageFlip = 0.85;
    } else {
      targetPageFlip = 0;
    }
  }

  // Smooth physics
  const kAzimuth = 260;
  const dAzimuth = 24;
  azimuthVelocity += ((targetAzimuth - currentAzimuth) * kAzimuth - azimuthVelocity * dAzimuth) * dt;
  currentAzimuth += azimuthVelocity * dt;

  const kTilt = 320;
  const dTilt = 24;
  tiltVelocity += ((targetTilt - currentTilt) * kTilt - tiltVelocity * dTilt) * dt;
  currentTilt += tiltVelocity * dt;

  panX += (targetPanX - panX) * Math.min(1, dt * 20);
  panY += (targetPanY - panY) * Math.min(1, dt * 20);
  zoomScale += (targetZoomScale - zoomScale) * Math.min(1, dt * 20);

  const kPage = 400;
  const dPage = 28;
  pageVelocity += ((targetPageFlip - pageFlip) * kPage - pageVelocity * dPage) * dt;
  pageFlip += pageVelocity * dt;
  if (pageFlip < 0) { pageFlip = 0; pageVelocity = 0; }

  renderFrame();

  const settled = !isTurntableActive && !touring &&
    Math.abs(targetAzimuth - currentAzimuth) < 1e-3 &&
    Math.abs(azimuthVelocity) < 1e-3 &&
    Math.abs(targetTilt - currentTilt) < 1e-4 &&
    Math.abs(tiltVelocity) < 1e-4 &&
    Math.abs(targetPanX - panX) < 1e-2 &&
    Math.abs(targetPanY - panY) < 1e-2 &&
    Math.abs(targetZoomScale - zoomScale) < 1e-3 &&
    Math.abs(targetPageFlip - pageFlip) < 1e-4 &&
    Math.abs(pageVelocity) < 1e-4;

  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    lastTime = 0;
    frame = requestAnimationFrame(tick);
  }
}

function wake() {
  if (!isTurntableActive) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!still.matches && !isTurntableActive) {
        touring = true;
        clock = 0;
        run();
      }
    }, 4500);
  }
  run();
}

stage.addEventListener("pointerdown", (e) => {
  isDragging = true;
  dragMode = (e.button === 2 || e.shiftKey) ? "pan" : "orbit";
  startPointerX = e.clientX;
  startPointerY = e.clientY;
  startAzimuth = targetAzimuth;
  startTilt = targetTilt;
  startPanX = targetPanX;
  startPanY = targetPanY;
  stage.setPointerCapture?.(e.pointerId);
  wake();
});

stage.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  const dx = e.clientX - startPointerX;
  const dy = e.clientY - startPointerY;
  if (dragMode === "pan") {
    targetPanX = startPanX + dx;
    targetPanY = startPanY + dy;
  } else {
    targetAzimuth = startAzimuth - dx * 0.55;
    const minAngle = 18 * Math.PI / 180;
    const maxAngle = 48 * Math.PI / 180;
    targetTilt = Math.max(minAngle, Math.min(maxAngle, startTilt - dy * 0.0035));
  }
  run();
});

stage.addEventListener("pointerup", () => {
  isDragging = false;
  wake();
});

stage.addEventListener("pointercancel", () => {
  isDragging = false;
  wake();
});

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  wake();
  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
  targetZoomScale = Math.max(0.65, Math.min(2.2, targetZoomScale * zoomFactor));
  run();
}, { passive: false });

stage.addEventListener("contextmenu", (e) => e.preventDefault());

stage.addEventListener("click", (e) => {
  const dx = Math.abs(e.clientX - startPointerX);
  const dy = Math.abs(e.clientY - startPointerY);
  if (dx < 5 && dy < 5) {
    wake();
    targetPageFlip = targetPageFlip > 0.4 ? 0 : 1;
    run();
  }
});

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

renderFrame();
run();

window.addEventListener("message", (e) => {
  if (!e.data) return;
  if (e.data.type === "set-theme") {
    document.body.setAttribute("data-theme", e.data.theme);
    document.documentElement.setAttribute("data-theme", e.data.theme);
  } else if (e.data.type === "rotate") {
    wake();
    targetAzimuth += (e.data.delta || 45);
    run();
  } else if (e.data.type === "toggle-turntable") {
    isTurntableActive = !isTurntableActive;
    if (isTurntableActive) { touring = false; clearTimeout(idleTimer); }
    run();
  } else if (e.data.type === "reset") {
    wake();
    isTurntableActive = false;
    targetAzimuth = 42;
    targetTilt = NOMINAL_TILT;
    targetPanX = 0;
    targetPanY = 0;
    targetZoomScale = 1.0;
    targetPageFlip = 0;
    run();
  } else if (e.data.type === "zoom") {
    wake();
    targetZoomScale = Math.max(0.65, Math.min(2.2, targetZoomScale * (e.data.delta > 0 ? 1.2 : 0.8)));
    run();
  } else if (e.data.type === "set-slide") {
    const num = Number(e.data.slideNumber || e.data.slideIndex || 1);
    if (typeof SLIDE_ARTIFACTS !== "undefined" && SLIDE_ARTIFACTS[num]) {
      currentSlide = num;
      updateSlideHeaders();
      wake();
      run();
    }
  }
});
