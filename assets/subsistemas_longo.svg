<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="100%" height="100%" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Marcadores de Flechas -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#000000" />
    </marker>

    <!-- Estilos Tipográficos y Estructurales -->
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .main-title { font-size: 20px; font-weight: bold; fill: #003399; letter-spacing: 0.5px; }
      .strategy-text { font-size: 18px; font-weight: bold; font-style: italic; fill: #CC0000; letter-spacing: 0.5px; }
      .header-text { font-size: 17px; font-weight: bold; fill: #003399; }
      .body-bold { font-size: 15px; font-weight: bold; fill: #003399; }
      .body-italic { font-size: 13px; font-weight: normal; font-style: italic; fill: #000000; }
      .line-box { stroke: #000000; stroke-width: 1.5; fill: none; }
      .line-thin { stroke: #000000; stroke-width: 1.25; fill: none; }
    </style>
  </defs>

  <!-- Marco Exterior -->
  <rect x="20" y="15" width="880" height="610" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>

  <!-- Título Principal -->
  <line x1="20" y1="25" x2="900" y2="25" stroke="#003399" stroke-width="3"/>
  <text x="460" y="50" class="main-title" text-anchor="middle">SUBSISTEMAS DE LA GESTIÓN DE RECURSOS HUMANOS</text>
  <line x1="20" y1="65" x2="900" y2="65" stroke="#003399" stroke-width="3"/>

  <!-- Cuadro Estrategia -->
  <rect x="370" y="82" width="180" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
  <text x="460" y="105" class="strategy-text" text-anchor="middle">ESTRATEGIA</text>

  <!-- Flecha Azul Estrategia -->
  <path d="M 450 116 H 470 V 135 H 480 L 460 152 L 440 135 H 450 Z" fill="#003399"/>

  <!-- Contenedor Principal del Diagrama -->
  <rect x="55" y="158" width="810" height="435" fill="#FFFFFF" stroke="#000000" stroke-width="1.75"/>

  <!-- Nivel Superior: Planificación -->
  <line x1="55" y1="205" x2="865" y2="205" class="line-thin"/>
  <text x="460" y="188" class="header-text" text-anchor="middle">Planificación</text>

  <!-- Líneas de Distribución desde Planificación -->
  <line x1="140" y1="215" x2="755" y2="215" class="line-thin"/>
  <line x1="460" y1="205" x2="460" y2="215" class="line-thin"/>
  
  <line x1="140" y1="215" x2="140" y2="228" class="line-thin" marker-end="url(#arrow-down)"/>
  <line x1="325" y1="215" x2="325" y2="228" class="line-thin" marker-end="url(#arrow-down)"/>
  <line x1="510" y1="215" x2="510" y2="228" class="line-thin" marker-end="url(#arrow-down)"/>
  <line x1="755" y1="215" x2="755" y2="228" class="line-thin" marker-end="url(#arrow-down)"/>

  <!-- Divisiones Verticales Centrales -->
  <line x1="225" y1="205" x2="225" y2="480" class="line-thin"/>
  <line x1="425" y1="205" x2="425" y2="480" class="line-thin"/>
  <line x1="595" y1="205" x2="595" y2="480" class="line-thin"/>
  <line x1="595" y1="342" x2="865" y2="342" class="line-thin"/>

  <!-- Columna 1: Organización del trabajo -->
  <text x="140" y="270" class="body-bold" text-anchor="middle">Organización</text>
  <text x="140" y="290" class="body-bold" text-anchor="middle">del trabajo</text>

  <text x="72" y="350" class="body-italic">Diseño de puestos</text>
  <text x="72" y="375" class="body-italic">Definición de</text>
  <text x="72" y="393" class="body-italic">perfiles</text>

  <!-- Flecha Horizontal: Columna 1 -> Columna 2 -->
  <line x1="195" y1="280" x2="265" y2="280" class="line-thin" marker-end="url(#arrow-right)"/>

  <!-- Columna 2: Gestión del empleo -->
  <text x="325" y="270" class="body-bold" text-anchor="middle">Gestión del</text>
  <text x="325" y="290" class="body-bold" text-anchor="middle">empleo</text>

  <text x="245" y="345" class="body-italic">Incorporación</text>
  <text x="245" y="373" class="body-italic">Movilidad</text>
  <text x="245" y="401" class="body-italic">Desvinculación</text>

  <!-- Flecha Horizontal: Columna 2 -> Columna 3 -->
  <line x1="385" y1="280" x2="455" y2="280" class="line-thin" marker-end="url(#arrow-right)"/>

  <!-- Columna 3: Gestión del rendimiento -->
  <text x="510" y="270" class="body-bold" text-anchor="middle">Gestión del</text>
  <text x="510" y="290" class="body-bold" text-anchor="middle">rendimiento</text>

  <text x="435" y="350" class="body-italic">Planificación</text>
  <text x="435" y="378" class="body-italic">Evaluación</text>

  <!-- Doble Flecha Horizontal: Rendimiento <-> Compensación -->
  <line x1="570" y1="280" x2="620" y2="280" class="line-thin" marker-start="url(#arrow-left)" marker-end="url(#arrow-right)"/>

  <!-- Doble Flecha Horizontal: Rendimiento <-> Desarrollo -->
  <line x1="570" y1="380" x2="620" y2="380" class="line-thin" marker-start="url(#arrow-left)" marker-end="url(#arrow-right)"/>

  <!-- Columna 4 Superior: Gestión de la compensación -->
  <text x="730" y="250" class="body-bold" text-anchor="middle">Gestión de la</text>
  <text x="730" y="270" class="body-bold" text-anchor="middle">compensación</text>

  <text x="612" y="303" class="body-italic">Retribución monetaria</text>
  <text x="612" y="320" class="body-italic">y no monetaria</text>

  <!-- Doble Flecha Vertical: Compensación <-> Desarrollo -->
  <line x1="840" y1="318" x2="840" y2="366" class="line-thin" marker-start="url(#arrow-up)" marker-end="url(#arrow-down)"/>

  <!-- Columna 4 Inferior: Gestión del desarrollo -->
  <text x="730" y="372" class="body-bold" text-anchor="middle">Gestión del</text>
  <text x="730" y="392" class="body-bold" text-anchor="middle">desarrollo</text>

  <text x="612" y="422" class="body-italic">Promoción y carrera</text>
  <text x="612" y="446" class="body-italic">Aprendizaje</text>
  <text x="612" y="463" class="body-italic">individual y colectivo</text>

  <!-- División Nivel Inferior -->
  <line x1="55" y1="480" x2="865" y2="480" class="line-thin"/>

  <!-- Flechas Ascendentes desde Nivel Inferior -->
  <line x1="140" y1="492" x2="140" y2="468" class="line-thin" marker-end="url(#arrow-up)"/>
  <line x1="325" y1="492" x2="325" y2="468" class="line-thin" marker-end="url(#arrow-up)"/>
  <line x1="510" y1="492" x2="510" y2="468" class="line-thin" marker-end="url(#arrow-up)"/>
  <line x1="730" y1="492" x2="730" y2="468" class="line-thin" marker-end="url(#arrow-up)"/>

  <!-- Nivel Inferior: Gestión de las relaciones humanas y sociales -->
  <text x="460" y="512" class="body-bold" text-anchor="middle">Gestión de las relaciones</text>
  <text x="460" y="530" class="body-bold" text-anchor="middle">humanas y sociales</text>

  <text x="140" y="562" class="body-italic" text-anchor="middle">Clima laboral</text>
  <text x="460" y="562" class="body-italic" text-anchor="middle">Relaciones laborales</text>
  <text x="755" y="562" class="body-italic" text-anchor="middle">Políticas sociales</text>
</svg>
